<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login &ndash; {{ app_name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet"/>
    <style>
        :root {
            --primary: #4f46e5; --primary-dark: #3730a3; --accent: #06b6d4;
            --font-main: 'Plus Jakarta Sans', sans-serif; --font-head: 'Space Grotesk', sans-serif;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: var(--font-main);
            min-height: 100vh;
            background: #0b1120;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
        }
        .bg-canvas { position: fixed; inset: 0; z-index: 0; }
        .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: 0.35; }
        .orb-1 { width: 500px; height: 500px; background: #4f46e5; top: -150px; left: -150px; }
        .orb-2 { width: 400px; height: 400px; background: #06b6d4; bottom: -120px; right: -100px; }
        .orb-3 { width: 300px; height: 300px; background: #8b5cf6; top: 50%; left: 50%; transform: translate(-50%,-50%); }
        body::before {
            content: ''; position: fixed; inset: 0; z-index: 1;
            background-image: linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .auth-wrap { position: relative; z-index: 10; width: 100%; max-width: 440px; padding: 20px; }
        .auth-card {
            background: rgba(255,255,255,0.06);
            backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.12); border-radius: 24px;
            padding: 44px 40px; box-shadow: 0 32px 64px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
        }
        .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 32px; justify-content: center; }
        .brand-icon-wrap {
            width: 48px; height: 48px; border-radius: 14px;
            background: linear-gradient(135deg, var(--primary), var(--accent));
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; box-shadow: 0 8px 20px rgba(79,70,229,0.4);
        }
        .brand-text { font-family: var(--font-head); font-size: 24px; font-weight: 700; color: #fff; }
        .brand-sub { font-size: 12px; color: rgba(255,255,255,0.5); letter-spacing: 0.5px; }
        h2 { font-family: var(--font-head); font-size: 22px; font-weight: 700; color: #fff; margin-bottom: 4px; }
        .sub-text { font-size: 13.5px; color: rgba(255,255,255,0.5); margin-bottom: 28px; }
        .form-label { color: rgba(255,255,255,0.7); font-size: 13px; font-weight: 600; margin-bottom: 6px; }
        .form-control {
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
            color: #fff; border-radius: 10px; padding: 11px 14px;
            font-family: var(--font-main); font-size: 14px; transition: all 0.2s;
        }
        .form-control::placeholder { color: rgba(255,255,255,0.3); }
        .form-control:focus {
            background: rgba(255,255,255,0.1); border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79,70,229,0.25); color: #fff; outline: none;
        }
        .input-group-text {
            background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
            color: rgba(255,255,255,0.5); border-radius: 0 10px 10px 0 !important; cursor: pointer;
        }
        .input-group .form-control { border-radius: 10px 0 0 10px !important; border-right: none; }
        .form-check-input { background-color: transparent; border-color: rgba(255,255,255,0.3); }
        .form-check-input:checked { background-color: var(--primary); border-color: var(--primary); }
        .form-check-label { color: rgba(255,255,255,0.6); font-size: 13px; }
        .btn-login {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            border: none; color: #fff; width: 100%; padding: 12px; border-radius: 10px;
            font-weight: 700; font-size: 15px; font-family: var(--font-main);
            box-shadow: 0 8px 20px rgba(79,70,229,0.35);
        }
        .btn-login:hover { color:#fff; }
        .divider { display: flex; align-items: center; gap: 12px; margin: 22px 0; }
        .divider hr { flex: 1; border-color: rgba(255,255,255,0.12); }
        .divider span { color: rgba(255,255,255,0.35); font-size: 12px; }
        .register-link { text-align: center; color: rgba(255,255,255,0.5); font-size: 13.5px; }
        .register-link a { color: var(--accent); font-weight: 600; text-decoration: none; }
        .test-creds {
            margin-top: 22px; background: rgba(79,70,229,0.12);
            border: 1px solid rgba(79,70,229,0.25); border-radius: 10px; padding: 14px 16px;
        }
        .test-creds p { color: rgba(255,255,255,0.6); font-size: 12px; margin: 0 0 6px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .test-creds code { color: var(--accent); font-size: 12px; display: block; line-height: 1.8; }
        .alert-danger { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); color: #fca5a5; border-radius: 10px; font-size: 13px; }
    </style>
</head>
<body>
<div class="bg-canvas">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
</div>

<div class="auth-wrap">
    <div class="auth-card">
        <div class="brand">
            <div class="brand-icon-wrap">📈</div>
            <div>
                <div class="brand-text">{{ app_name }}</div>
                <div class="brand-sub">Intelligent Sales Forecasting</div>
            </div>
        </div>

        <h2>Welcome back</h2>
        <p class="sub-text">Sign in to your account to continue</p>

        {% if error %}
        <div class="alert alert-danger mb-3"><i class="bi bi-exclamation-circle me-2"></i>{{ error }}</div>
        {% endif %}

        <form method="POST" action="" id="loginForm" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div class="mb-3">
                <label class="form-label">Email or Username</label>
                <input type="text" name="login_id" class="form-control"
                    placeholder="admin@forecastinq.com"
                    value="{{ request.form.get('login_id', '') }}" required autofocus/>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <div class="input-group">
                    <input type="password" name="password" id="passwordField" class="form-control" placeholder="Enter your password" required/>
                    <span class="input-group-text" onclick="togglePwd()">
                        <i class="bi bi-eye" id="eyeIcon"></i>
                    </span>
                </div>
            </div>

            <div class="d-flex align-items-center justify-content-between mb-3">
                <div class="form-check mb-0">
                    <input class="form-check-input" type="checkbox" name="remember_me" id="rememberMe"/>
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">Sign In</button>
        </form>

        <div class="divider"><hr/><span>OR</span><hr/></div>
        <div class="register-link">
            Don't have an account? <a href="{{ url_for('auth.register') }}">Create one</a>
        </div>

        <div class="test-creds">
            <p>🔑 Demo Credentials</p>
            <code>
                admin / Admin@123 (Admin)<br>
                manager / Admin@123 (Manager)<br>
                staff / Admin@123 (Staff)
            </code>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePwd() {
    const f = document.getElementById('passwordField');
    const i = document.getElementById('eyeIcon');
    if (f.type === 'password') { f.type = 'text'; i.className = 'bi bi-eye-slash'; }
    else { f.type = 'password'; i.className = 'bi bi-eye'; }
}
</script>
</body>
</html>
