<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Register &ndash; {{ app_name }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet"/>
    <style>
        :root { --primary:#4f46e5; --accent:#06b6d4; }
        body { font-family:'Plus Jakarta Sans',sans-serif; min-height:100vh; background:#0b1120; display:flex; align-items:center; justify-content:center; padding:20px; }
        .bg-canvas { position:fixed; inset:0; z-index:0; }
        .orb { position:absolute; border-radius:50%; filter:blur(80px); opacity:.3; }
        .orb-1 { width:500px; height:500px; background:#4f46e5; top:-200px; right:-100px; }
        .orb-2 { width:400px; height:400px; background:#06b6d4; bottom:-150px; left:-100px; }
        .auth-wrap { position:relative; z-index:10; width:100%; max-width:520px; }
        .auth-card { background:rgba(255,255,255,.06); backdrop-filter:blur(24px); border:1px solid rgba(255,255,255,.12); border-radius:24px; padding:40px; box-shadow:0 32px 64px rgba(0,0,0,.4); }
        .brand { display:flex; align-items:center; gap:10px; margin-bottom:28px; justify-content:center; }
        .brand-icon { width:44px; height:44px; border-radius:12px; background:linear-gradient(135deg,#4f46e5,#06b6d4); display:flex; align-items:center; justify-content:center; font-size:22px; }
        .brand-text { font-family:'Space Grotesk',sans-serif; font-size:22px; font-weight:700; color:#fff; }
        h2 { font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700; color:#fff; margin-bottom:4px; }
        .sub { font-size:13.5px; color:rgba(255,255,255,.5); margin-bottom:24px; }
        .form-label { color:rgba(255,255,255,.7); font-size:13px; font-weight:600; margin-bottom:5px; }
        .form-control, .form-select { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); color:#fff; border-radius:10px; padding:10px 14px; font-size:13.5px; font-family:'Plus Jakarta Sans',sans-serif; }
        .form-control::placeholder { color:rgba(255,255,255,.3); }
        .form-control:focus, .form-select:focus { background:rgba(255,255,255,.1); border-color:#4f46e5; box-shadow:0 0 0 3px rgba(79,70,229,.2); color:#fff; }
        .form-select option { background:#131e35; }
        .btn-register { background:linear-gradient(135deg,#4f46e5,#3730a3); border:none; color:#fff; width:100%; padding:12px; border-radius:10px; font-weight:700; font-size:15px; font-family:'Plus Jakarta Sans',sans-serif; }
        .btn-register:hover { color:#fff; }
        .login-link { text-align:center; color:rgba(255,255,255,.5); font-size:13.5px; margin-top:18px; }
        .login-link a { color:#06b6d4; font-weight:600; text-decoration:none; }
        .alert-danger { background:rgba(239,68,68,.15); border:1px solid rgba(239,68,68,.3); color:#fca5a5; border-radius:10px; font-size:13px; }
        .alert-success { background:rgba(16,185,129,.15); border:1px solid rgba(16,185,129,.3); color:#6ee7b7; border-radius:10px; font-size:13px; }
        .input-group .form-control { border-radius:10px 0 0 10px !important; border-right:none; }
        .input-group-text { background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.12); color:rgba(255,255,255,.5); border-radius:0 10px 10px 0 !important; cursor:pointer; }
    </style>
</head>
<body>
<div class="bg-canvas"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-icon">📈</div>
      <div class="brand-text">{{ app_name }}</div>
    </div>
    <h2>Create Account</h2>
    <p class="sub">Fill in your details to register</p>

    {% if error %}<div class="alert alert-danger mb-3"><i class="bi bi-exclamation-circle me-2"></i>{{ error }}</div>{% endif %}
    {% if success %}<div class="alert alert-success mb-3"><i class="bi bi-check-circle me-2"></i>{{ success }} <a href="{{ url_for('auth.login') }}" style="color:inherit;font-weight:700;">Login now</a></div>{% endif %}

    <form method="POST" action="" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
      <div class="row g-3">
        <div class="col-12">
          <label class="form-label">Full Name *</label>
          <input type="text" name="full_name" class="form-control" placeholder="Rajesh Kumar" value="{{ form.get('full_name','') }}" required/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Email Address *</label>
          <input type="email" name="email" class="form-control" placeholder="you@email.com" value="{{ form.get('email','') }}" required/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Username *</label>
          <input type="text" name="username" class="form-control" placeholder="rajesh123" value="{{ form.get('username','') }}" required/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Phone Number</label>
          <input type="tel" name="phone" class="form-control" placeholder="+91 98765 43210" value="{{ form.get('phone','') }}"/>
        </div>
        <div class="col-md-6">
          <label class="form-label">Role *</label>
          <select name="role" class="form-select" required>
            <option value="staff" {{ 'selected' if form.get('role')=='staff' else '' }}>Staff</option>
            <option value="manager" {{ 'selected' if form.get('role')=='manager' else '' }}>Manager</option>
            <option value="admin" {{ 'selected' if form.get('role')=='admin' else '' }}>Admin</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label">Password *</label>
          <div class="input-group">
            <input type="password" name="password" id="pw1" class="form-control" placeholder="Min. 6 characters" required/>
            <span class="input-group-text" onclick="togglePwd('pw1','e1')"><i class="bi bi-eye" id="e1"></i></span>
          </div>
        </div>
        <div class="col-md-6">
          <label class="form-label">Confirm Password *</label>
          <div class="input-group">
            <input type="password" name="confirm_password" id="pw2" class="form-control" placeholder="Repeat password" required/>
            <span class="input-group-text" onclick="togglePwd('pw2','e2')"><i class="bi bi-eye" id="e2"></i></span>
          </div>
        </div>
        <div class="col-12 mt-2">
          <button type="submit" class="btn-register">Create Account</button>
        </div>
      </div>
    </form>
    <div class="login-link">Already have an account? <a href="{{ url_for('auth.login') }}">Sign in</a></div>
  </div>
</div>
<script>
function togglePwd(id, iconId) {
    const f = document.getElementById(id), i = document.getElementById(iconId);
    f.type = f.type === 'password' ? 'text' : 'password';
    i.className = f.type === 'password' ? 'bi bi-eye' : 'bi bi-eye-slash';
}
</script>
</body>
</html>
